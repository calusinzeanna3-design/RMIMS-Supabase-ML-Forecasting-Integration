<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:5000 http://localhost:5000; frame-ancestors 'none'; base-uri 'self';">
<title>RMSME — Sign In</title>
<link rel="icon" href="assets/favicon-64.png" type="image/png">

<link rel="stylesheet" href="css/rmims-theme.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/user-entry.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/user-auth.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="rmsme-entry-lock">

<div class="rm-stage" id="rmStage">

  <!-- RAW MATERIAL BACKGROUND ILLUSTRATION (same as landing page) -->
  <svg class="material-illustration" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

    <g class="cluster-back" opacity="0.7">
      <path class="m-shape" d="M260 860 L260 260 M520 860 L520 220 M1080 860 L1080 220 M1340 860 L1340 260" stroke-width="1.2"/>
      <path class="m-shape" d="M220 320 L1380 320 M220 480 L1380 480 M220 640 L1380 640" stroke-width="1.2"/>
      <rect class="m-shape" x="330" y="270" width="70" height="42" rx="4" stroke-width="1.2"/>
      <rect class="m-shape" x="640" y="430" width="70" height="42" rx="4" stroke-width="1.2"/>
      <rect class="m-shape" x="960" y="270" width="70" height="42" rx="4" stroke-width="1.2"/>
      <rect class="m-shape" x="1180" y="590" width="70" height="42" rx="4" stroke-width="1.2"/>
    </g>

    <g class="cluster-left">
      <rect class="m-shape fill-soft" x="120" y="470" width="130" height="110" rx="8"/>
      <path class="m-shape" d="M120 470 L185 420 L250 470 M185 420 L185 470" stroke-width="1.4"/>
      <path class="m-shape" d="M185 470 L185 580 M120 525 L250 525" stroke-width="1.2"/>
      <rect class="m-shape" x="70" y="600" width="86" height="60" rx="6"/>
      <rect class="m-shape" x="70" y="600" width="86" height="16" rx="4" opacity="0.4"/>
      <rect class="m-shape" x="190" y="618" width="70" height="52" rx="6" transform="rotate(-4 190 618)"/>
      <circle class="m-dot" cx="300" cy="560" r="4"/>
      <circle class="m-dot" cx="95" cy="440" r="3"/>
    </g>

    <g class="cluster-right">
      <path class="m-shape fill-soft"
        d="M1290 470
           C1260 470 1246 500 1250 540
           C1254 590 1272 630 1310 630
           C1348 630 1366 590 1370 540
           C1374 500 1360 470 1330 470
           C1322 458 1298 458 1290 470 Z"/>
      <path class="m-shape" d="M1300 470 C1305 460 1315 460 1320 470" stroke-width="1.3"/>
      <path class="m-shape" d="M1268 540 C1300 552 1320 552 1352 540 M1268 575 C1300 587 1320 587 1352 575" stroke-width="1.1" opacity="0.6"/>
      <path class="m-shape"
        d="M1420 560
           C1400 560 1390 580 1393 608
           C1396 640 1408 664 1432 664
           C1456 664 1468 640 1471 608
           C1474 580 1464 560 1444 560 Z"
        transform="scale(0.72) translate(560 250)"/>
      <path class="m-shape" d="M1200 640 L1200 690 M1260 640 L1260 690 M1200 690 L1260 690" stroke-width="1.3"/>
      <circle class="m-shape" cx="1230" cy="618" r="20" stroke-width="1.3"/>
      <circle class="m-dot" cx="1400" cy="480" r="3"/>
      <circle class="m-dot" cx="1245" cy="700" r="4"/>
    </g>

    <g class="cluster-top" opacity="0.8">
      <rect class="m-shape" x="760" y="120" width="60" height="46" rx="6" transform="rotate(6 760 120)"/>
      <path class="m-shape" d="M900 150 L940 150 L940 190 L900 190 Z M900 150 L920 168 L940 150" stroke-width="1.2"/>
      <circle class="m-dot" cx="1000" cy="130" r="3"/>
    </g>

  </svg>

  <!-- SIGN IN CARD -->
  <main class="workspace-panel auth-panel">

    <div class="panel-topbar">
      <div class="brand-mark">
        <span class="brand-icon brand-icon--logo">
          <img src="assets/logo-icon.png" alt="RMsme logo">
        </span>
        <span class="brand-word">RMSME</span>
      </div>
      <div class="status-pill">
        <span class="dot"></span>
        System Online
      </div>
    </div>

    <a class="ue-back" href="portal.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </a>

    <div class="ue-header">
      <span class="ue-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M10 17L15 12L10 7M15 12H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <p class="ue-eyebrow">User Account</p>
      <h1>Welcome back</h1>
      <p>Sign in to track usage and view your materials.</p>
    </div>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5L12 13L21 6.5M5 19H19C20.1046 19 21 18.1046 21 17V7C21 5.89543 20.1046 5 19 5H5C3.89543 5 3 5.89543 3 7V17C3 18.1046 3.89543 19 5 19Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="email" id="email" placeholder="Enter email" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 11V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="password" id="password" placeholder="Enter password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox">
          <span class="checkmark"></span>
          Remember Me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <p class="form-note" id="loginError"></p>

      <button type="submit" class="login-btn" id="loginSubmitBtn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Log In
      </button>

    </form>

    <details class="demo-box">
      <summary>View Demo Account</summary>
      <div class="demo-content">
        <div class="demo-account">
          <strong>User</strong>
          <p>user@rmims.com</p>
          <p>User123!</p>
        </div>
      </div>
    </details>

  </main>

</div>

<script type="module" src="js/user-signin.js"></script>
</body>
</html>
